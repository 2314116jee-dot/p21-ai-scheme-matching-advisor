name: Deploy P21 to Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Run Tests ───────────────────────────────────────────────
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: p21_test
          POSTGRES_USER: p21_user
          POSTGRES_PASSWORD: p21_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://p21_user:p21_password@localhost:5432/p21_test
      SECRET_KEY: test_secret_key_32_chars_minimum_here
      CSRF_SECRET: test_csrf_secret_key_32_chars_min
      ENVIRONMENT: test
      AI_PROVIDER: deterministic
      AI_ENABLED: "false"
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      
      - name: Run Alembic migrations
        run: alembic upgrade head
      
      - name: Run test suite
        run: python -m pytest -v --tb=short

  # ─── Build & Deploy Frontend to Vercel ───────────────────────
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      
      - name: Deploy to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  # ─── Deploy Backend to Render ────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            --fail
        # Set RENDER_DEPLOY_HOOK_URL in GitHub Secrets
        # Get it from: Render dashboard → Service → Settings → Deploy Hook
