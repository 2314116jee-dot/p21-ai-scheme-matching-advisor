# Render.com deployment configuration
# https://render.com/docs/yaml-spec
# Deploy this repo to Render by connecting GitHub and pointing to this file

services:
  - type: web
    name: p21-backend
    runtime: python
    plan: free
    region: singapore  # Closest to India

    # Build command (runs on deploy)
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"

    # Start command
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1"

    # Python version
    pythonVersion: "3.12"

    # Health check
    healthCheckPath: /api/health

    # Auto-deploy on push to main
    autoDeploy: true

    # Environment Variables (set secrets in Render dashboard)
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0

      # Database - Neon.tech free PostgreSQL
      # Set DATABASE_URL in Render dashboard (from Neon connection string)
      - key: DATABASE_URL
        sync: false  # Must be set manually in dashboard

      # Security Secrets (auto-generated by Render)
      - key: SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true

      # Cookie settings for production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax

      # Token expiry
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      # Algorithm
      - key: ALGORITHM
        value: HS256

      # AI Provider - Use Gemini (free tier)
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false  # Set in Render dashboard

      - key: AI_TIMEOUT_SECONDS
        value: "25"
      - key: AI_ENABLED
        value: "true"

      # CORS - Set to your Vercel frontend URL after deploy
      # e.g. https://p21.vercel.app
      - key: CORS_ORIGINS
        sync: false  # Set in Render dashboard after Vercel deploy

      # Rate limiting
      - key: RATE_LIMIT_LOGIN_MAX
        value: "10"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
